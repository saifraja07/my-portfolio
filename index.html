<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Saif Ali Raja — Portfolio</title>
    <meta name="description" content="Saif Ali Raja's personal portfolio is currently under development." />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #0b0b0c;
            color: #f5f5f5;
            font-family:
                Inter, -apple-system, BlinkMacSystemFont, "Segoe UI",
                Roboto, Helvetica, Arial, sans-serif;
        }

        .container {
            width: 100%;
            max-width: 680px;
            text-align: center;
        }

        .status {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 28px;
            padding: 7px 12px;
            border: 1px solid #252525;
            border-radius: 999px;
            background: #111112;
            color: #a8a8a8;
            font-size: 13px;
            letter-spacing: 0.02em;
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: #7ddf91;
            box-shadow: 0 0 10px rgba(125, 223, 145, 0.45);
        }

        h1 {
            font-size: clamp(42px, 8vw, 72px);
            line-height: 1;
            letter-spacing: -0.05em;
            font-weight: 700;
            margin-bottom: 20px;
        }

        .message {
            max-width: 560px;
            margin: 0 auto;
            color: #a3a3a3;
            font-size: clamp(16px, 2.5vw, 19px);
            line-height: 1.7;
        }

        .message strong {
            color: #e8e8e8;
            font-weight: 500;
        }

        .footer {
            margin-top: 42px;
            color: #555;
            font-size: 13px;
        }

        @media (prefers-reduced-motion: no-preference) {
            .container {
                animation: appear 0.7s ease-out both;
            }

            @keyframes appear {
                from {
                    opacity: 0;
                    transform: translateY(8px);
                }

                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="status">
            <span class="dot"></span>
            Currently under development
        </div>

        <h1>Hey, I'm Saif.</h1>

        <p class="message">
            My portfolio is currently under development and will be
            here soon.
            <br />
            Thanks for stopping by — I really appreciate it.
            <br>
            checkout this project for now
            <a href="https://browser-os-one.vercel.app" target="_blank">Browser based OS</a>
        </p>

        <p class="footer">
            saifaliraja.com
        </p>
    </main>
</body>

</html>
